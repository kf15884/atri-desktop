<!doctype html><html><head><meta charset="utf-8"><title>Atri 设置</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>body{font-family:"Microsoft YaHei UI",sans-serif;font-size:14px;padding:16px 20px;margin:0}label{display:block;margin:12px 0 4px;color:#444}
input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:7px;border:1px solid #ccc;border-radius:6px}
.row{display:flex;gap:8px;align-items:center}.row input[type=range]{flex:1}small{color:#888}button{padding:7px 14px;border-radius:6px;border:1px solid #bbb;background:#fff;cursor:pointer}
#save{background:#5b8def;color:#fff;border:0;margin-top:18px}#msg{color:#2a9d55;margin-left:8px}</style></head><body>
<label>服务器地址</label><input id="url" type="text"><small>默认 ws://127.0.0.1:15150（经 SSH 隧道）</small>
<label>连接令牌</label><input id="token" type="password" placeholder="已保存时留空不改"><small>与 Koishi 里 atri-desktop 的 token 相同，加密保存在本机</small>
<label>立绘图片</label><div class="row"><input id="image" type="text" readonly><button id="pick">选择…</button></div><small>建议透明背景 PNG</small>
<label>不透明度 <span id="ov"></span></label><div class="row"><input id="opacity" type="range" min="10" max="100"></div>
<label>气泡显示秒数</label><input id="bubble" type="text" style="width:80px">
<div><button id="save">保存</button><span id="msg"></span></div>
<script src="setup-ui.js"></script></body></html>
