<!doctype html><html><head><meta charset="utf-8"><title>Atri</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' http: https: data:; style-src 'self' 'unsafe-inline'">
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;font-family:"Microsoft YaHei UI",sans-serif;background:#f3f4f7;font-size:14px}
#top{padding:8px 12px;background:#fff;border-bottom:1px solid #e3e3e8;display:flex;justify-content:space-between;align-items:center}
#conn{font-size:12px;color:#999}#conn.on{color:#2a9d55}
#list{flex:1;overflow:auto;padding:12px}
.row{display:flex;margin:6px 0}.row.user{justify-content:flex-end}
.msg{max-width:78%;padding:8px 11px;border-radius:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.atri .msg{background:#fff;border:1px solid #e6e6ec}.user .msg{background:#cfe4ff}
.meta{font-size:11px;color:#aaa;margin:0 4px;align-self:flex-end}
.note{color:#888}.msg-img{max-width:100%;border-radius:6px;display:block}
#bar{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #e3e3e8}
#input{flex:1;resize:none;height:64px;border:1px solid #ddd;border-radius:8px;padding:8px;font:inherit}
#send{width:72px;border:0;border-radius:8px;background:#5b8def;color:#fff;font:inherit;cursor:pointer}#send:disabled{background:#aac}
#err{color:#d44;font-size:12px;padding:0 12px 6px;background:#fff;min-height:0}
</style></head><body>
<div id="top"><b>Atri</b><button id="observe" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;background:white">本地观察</button><span id="conn">未连接</span></div>
<div id="list"></div>
<div id="err"></div>
<div id="bar"><textarea id="input" placeholder="和 Atri 说点什么…（Enter 发送，Shift+Enter 换行）"></textarea><button id="send">发送</button></div>
<script src="common.js"></script>
<script src="chat-ui.js"></script></body></html>
