<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Atri</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; connect-src 'none'">
<style>
:root{color-scheme:light dark;--bg:#f3f4f7;--panel:#fff;--line:#e3e3e8;--text:#24242a;--muted:#8a8a95;--me:#cfe4ff;--her:#fff;--accent:#5b8def;--bad:#d44}
@media(prefers-color-scheme:dark){:root{--bg:#17181b;--panel:#202126;--line:#33343a;--text:#eee;--muted:#9a9aa5;--me:#24456e;--her:#2a2b31;--accent:#6b9cff;--bad:#f48b83}}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;font:14px/1.55 system-ui,"Microsoft YaHei UI",sans-serif;background:var(--bg);color:var(--text)}
#top{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
#top b{font-size:15px}#conn{font-size:12px;color:var(--muted);cursor:pointer;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#conn::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#c55;margin-right:6px;vertical-align:1px}#conn.on::before{background:#3a5}
.tb{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);font:inherit;font-size:12px;cursor:pointer}
#settings{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
#settings input[type=range]{width:100%}#settings[hidden]{display:none}#settings input[type=checkbox]{justify-self:start}
#list{flex:1;overflow:auto;padding:12px}
.row{display:flex;margin:8px 0;align-items:flex-end;gap:6px}.row.me{justify-content:flex-end}
.col{max-width:80%;display:flex;flex-direction:column;gap:3px;align-items:flex-start}.me .col{align-items:flex-end}
.msg{padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.her .msg{background:var(--her);border:1px solid var(--line)}.me .msg{background:var(--me)}
.msg a{color:var(--accent)}
.meta{font-size:11px;color:var(--muted)}
.meta .tag{border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.sticker{max-width:160px;max-height:160px;border-radius:8px}.thumb{max-width:220px;border-radius:8px;display:block}
.failed{color:var(--bad)}.failed button{margin-left:6px}
#thinking{font-size:12px;color:var(--muted);padding:0 14px 6px;min-height:18px}
#chips{display:flex;gap:6px;padding:0 10px;flex-wrap:wrap}#chips img{height:56px;border-radius:6px;border:1px solid var(--line);cursor:pointer}
#bar{display:flex;gap:8px;padding:10px;background:var(--panel);border-top:1px solid var(--line);align-items:flex-end}
#input{flex:1;resize:none;height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--bg);color:var(--text)}
#send{width:72px;height:40px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}#send:disabled{opacity:.5}
#err{color:var(--bad);font-size:12px;padding:0 12px}
body.drag #list{outline:3px dashed var(--accent);outline-offset:-8px}
</style></head><body>
<div id="top"><b>Atri</b><span id="conn" title="连接设置">连接中…</span><button class="tb" id="together">一起看番</button><button class="tb" id="gear">设置</button></div>
<div id="settings" hidden>
  <span>立绘图片</span><span><button class="tb" id="pick">选图片…</button> <button class="tb" id="clearImg">不用图片</button> <span id="imgName" class="meta"></span></span>
  <span>立绘大小</span><input type="range" id="scale" min="0.4" max="2" step="0.1">
  <span>立绘透明度</span><input type="range" id="opacity" min="0.3" max="1" step="0.05">
  <span>气泡停留</span><span><input type="number" id="bubbleSeconds" min="3" max="120" style="width:5em"> 秒</span>
  <span>显示立绘</span><input type="checkbox" id="showPet">
  <span>新消息卡片</span><input type="checkbox" id="notify">
  <span>开机自动启动</span><input type="checkbox" id="autostart">
</div>
<div id="list" aria-live="polite"></div>
<div id="thinking"></div>
<div id="chips"></div>
<div id="err" role="alert"></div>
<div id="bar"><button class="tb" id="attach" title="发图（也可以粘贴、拖进来）">图</button><input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden><textarea id="input" placeholder="和 Atri 说点什么…（Enter 发送，Shift+Enter 换行；截图可以直接粘贴）"></textarea><button id="send">发送</button></div>
<script src="chat-ui.js"></script></body></html>
